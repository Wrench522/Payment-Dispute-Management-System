spring.application.name=payment-dispute-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payment_dispute_db}
spring.datasource.username=${DB_USERNAME:payment_dispute_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

